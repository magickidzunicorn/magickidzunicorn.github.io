<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site unavailable</title>
<style>
  :root { --bg: #ffffff; --ink: #0e1826; --muted: #566273; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1119; --ink: #e8edf3; --muted: #9eabbb; color-scheme: dark; } }
  html, body { height: 100%; }
  body { margin: 0; padding-inline: 16px; background: var(--bg); color: var(--ink);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         display: grid; place-items: center; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>This site is currently unavailable.</h1>
    <p>Please check back later.</p>
  </main>
</body>
</html>
